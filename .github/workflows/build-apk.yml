name: Build SpeakerTagRecorder APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Project Files
        run: |
          rm -rf android
          flutter create . --org com.example --project-name speaker_tag_recorder --platforms=android
          
          # Insert audio and storage permissions into standard generated manifest
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          """
          content = content.replace("<application", perms + "\n    <application", 1)
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '
          
          # Ensure minSdk is 23 for record package
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-warnings || true

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release -v > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## Gradle Build Error Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Dump and Commit Build Failure Log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tail -n 150 build.log > build-failure.txt
          git add build-failure.txt
          git commit -m "Auto: dump build failure log" || true
          git push origin main || true

      - name: Prepare Artifact
        run: |
          mkdir -p output
          APK_PATH=$(find build -type f -name "*release*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output/SpeakerTagRecorder.apk
          ls -lh output/SpeakerTagRecorder.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerTagRecorder-APK
          path: output/SpeakerTagRecorder.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SpeakerTagRecorder v1.0.${{ github.run_number }}"
          body: "Official Release APK for SpeakerTagRecorder Android App. Real-time speaker tagging and audio timestamp seek playback."
          files: output/SpeakerTagRecorder.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
