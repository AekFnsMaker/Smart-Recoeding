name: Build SpeakerTagRecorder APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Project Files
        run: |
          rm -rf android
          flutter create . --org com.example --project-name speaker_tag_recorder --platforms=android
          cp .github/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-warnings || true

      - name: Build Release APK
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log || (echo "=== GRADLE FAILURE LOG ===" && grep -i -E "error|exception|failure" build.log -B 2 -A 5 | head -n 100 && exit 1)

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/SpeakerTagRecorder.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerTagRecorder-APK
          path: output/SpeakerTagRecorder.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SpeakerTagRecorder v1.0.${{ github.run_number }}"
          body: "Official Release APK for SpeakerTagRecorder. Real-time speaker tagging and audio timestamp seek playback."
          files: output/SpeakerTagRecorder.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
