name: Build SpeakerTagRecorder APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Project Files
        run: |
          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              bg = f.read()
          bg = bg.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          bg = bg.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
          with open("android/app/build.gradle", "w") as f:
              f.write(bg)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Legacy Plugins for Flutter 3.24 AGP 8 Compatibility
        run: |
          python3 -c '
          import glob
          for path in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/*/android/build.gradle"):
              try:
                  with open(path, "r") as f:
                      content = f.read()
                  if "flutter.compileSdkVersion" in content or "flutter.minSdkVersion" in content:
                      content = content.replace("flutter.compileSdkVersion", "34")
                      content = content.replace("flutter.minSdkVersion", "23")
                      content = content.replace("flutter.targetSdkVersion", "34")
                      with open(path, "w") as f:
                          f.write(content)
                      print(f"Patched: {path}")
              except Exception as e:
                  print(f"Skip {path}: {e}")
          '

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-warnings || true

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release -v > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## Gradle Build Error Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Dump and Commit Build Failure Log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 -c '
          with open("build.log", "r", errors="ignore") as f:
              lines = f.readlines()
          idx = -1
          for i, line in enumerate(lines):
              if "BUILD FAILED" in line or "What went wrong" in line or "FAILURE:" in line:
                  idx = i
                  break
          if idx != -1:
              start = max(0, idx - 40)
              end = min(len(lines), idx + 60)
              out = "".join(lines[start:end])
          else:
              out = "".join(lines[-250:])
          with open("build-failure.txt", "w") as f:
              f.write(out)
          '
          git add build-failure.txt
          git commit -m "Auto: dump exact build failure reason" || true
          git push origin main || true

      - name: Prepare Artifact
        run: |
          mkdir -p output
          APK_PATH=$(find build -type f -name "*release*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output/SpeakerTagRecorder.apk
          cp "$APK_PATH" output/QuickVoiceScratchpad.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickVoiceScratchpad-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "QuickVoiceScratchpad & SpeakerTagRecorder v1.0.${{ github.run_number }}"
          body: "Official Release APK for Quick Voice & Scratchpad Capture + SpeakerTagRecorder for Android Tablets & Phones."
          files: |
            output/QuickVoiceScratchpad.apk
            output/SpeakerTagRecorder.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
